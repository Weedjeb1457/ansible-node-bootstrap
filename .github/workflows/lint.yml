name: lint

on:
  push:
  pull_request:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить Ansible и линтер
        run: pip install ansible ansible-lint
      - name: Запустить ansible-lint
        run: ansible-lint
