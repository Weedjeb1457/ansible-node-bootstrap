---
- name: Создать каталог для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Скачать ключ репозитория Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    checksum: "sha256:{{ docker_key_sha256 }}"
    mode: "0644"
  notify: Обновить кэш apt

- name: Добавить репозиторий Docker
  ansible.builtin.copy:
    content: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable\n"  # noqa: yaml[line-length]
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
  notify: Обновить кэш apt

- name: Применить обработчики до установки пакетов
  ansible.builtin.meta: flush_handlers

- name: Установить Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
