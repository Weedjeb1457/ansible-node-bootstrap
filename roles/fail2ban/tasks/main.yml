---
- name: Установить fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Задать порт SSH для jail sshd
  ansible.builtin.copy:
    content: "[sshd]\nport = {{ fail2ban_ssh_port }}\n"
    dest: /etc/fail2ban/jail.d/sshd-port.local
    mode: "0644"
  when: fail2ban_ssh_port | string | length > 0
  notify: Перезапустить fail2ban

- name: Включить и запустить fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
